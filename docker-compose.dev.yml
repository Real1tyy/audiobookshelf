# Development compose - run with: docker compose -f docker-compose.dev.yml up
# This is a STANDALONE file (don't merge with docker-compose.yml)

services:
  abs-proxy:
    image: nginx:alpine
    container_name: abs-dev-proxy
    depends_on:
      - abs-server
      - abs-client
    ports:
      - "13378:80"
    volumes:
      - "./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro"
    restart: unless-stopped

  abs-server:
    image: node:20-alpine
    container_name: abs-dev-server
    working_dir: /app
    command: >
      sh -lc "apk add --no-cache ffmpeg;
              if [ ! -x node_modules/.bin/nodemon ]; then npm ci; fi;
              npm run dev"
    environment:
      # Keep dev paths consistent with prod (served under /audiobookshelf)
      ROUTER_BASE_PATH: /audiobookshelf
      NODE_ENV: development
      # Use the mounted persistent dirs (matches prod compose)
      CONFIG_PATH: /config
      METADATA_PATH: /metadata
      # Avoid startup failing due to missing ffmpeg/ffprobe inside the plain node image
      SOURCE: docker
      # Ensure file watching works reliably on bind mounts across environments
      CHOKIDAR_USEPOLLING: "true"
      # Helpful default in dev; override if you want
      PORT: "3333"
      HOST: "0.0.0.0"
    ports:
      - "3333"
    volumes:
      - ".:/app"
      - abs_dev_root_node_modules:/app/node_modules
      - abs_dev_root_npm_cache:/root/.npm
      # Persisted ABS data (same as prod compose)
      - "./Data/audiobooks/:/audiobooks"
      - "./Data/podcasts:/podcasts"
      - "./Data/metadata:/metadata"
      - "./Data/config:/config"
    restart: unless-stopped

  abs-client:
    image: node:20-alpine
    container_name: abs-dev-client
    working_dir: /client
    command: >
      sh -lc "if [ ! -x node_modules/.bin/nuxt ]; then npm ci; fi;
              npm run dev"
    environment:
      ROUTER_BASE_PATH: /audiobookshelf
      ABS_SERVER_INTERNAL_URL: http://abs-server:3333
      ABS_SERVER_PUBLIC_URL: http://localhost:13378
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      # Avoid the huge Cypress binary download during npm ci (Cypress is an optionalDependency)
      CYPRESS_INSTALL_BINARY: "0"
    ports:
      - "3000"
    depends_on:
      - abs-server
    volumes:
      - "./client:/client"
      - abs_dev_client_node_modules:/client/node_modules
      - abs_dev_client_npm_cache:/root/.npm
    restart: unless-stopped

volumes:
  abs_dev_root_node_modules:
  abs_dev_root_npm_cache:
  abs_dev_client_node_modules:
  abs_dev_client_npm_cache:
