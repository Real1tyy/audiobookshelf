server {
  listen 80;
  server_name _;

  # Convenience: match production-ish base path
  location = / {
    return 302 /audiobookshelf/;
  }

  # Socket.IO (websocket) -> abs-server
  # Must be its own location so it doesn't fall through to the Nuxt dev proxy.
  location /audiobookshelf/socket.io {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_pass http://abs-server:3333;
  }

  # API + server routes -> abs-server
  location ~ ^/audiobookshelf/(api/|public/|hls/|auth/|feed/|status|login|logout|init) {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_pass http://abs-server:3333;
  }

  # Everything else under /audiobookshelf -> Nuxt dev (HMR)
  location /audiobookshelf/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_pass http://abs-client:3000;
  }
}
