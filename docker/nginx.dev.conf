server {
  listen 80;
  server_name _;

  # Dev proxy tuning:
  # - Nuxt dev uses long-lived SSE endpoints (HMR + loading indicator).
  # - Socket.IO uses websockets.
  # These need higher read timeouts, otherwise Nginx logs upstream timed out
  # when no data is sent for a while (normal for SSE).
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Reduce bandwidth for large JS bundles in dev (Nuxt's app.js/vendors).
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/x-javascript
    text/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # Convenience: match production-ish base path
  location = / {
    return 302 /audiobookshelf/;
  }

  # Nuxt long-lived SSE endpoints -> abs-client
  location = /audiobookshelf/_loading/sse {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://abs-client:3000;
  }

  # Nuxt HMR stream (EventSource/SSE) -> abs-client
  location /audiobookshelf/__webpack_hmr/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://abs-client:3000;
  }

  # Socket.IO (websocket) -> abs-server
  # Must be its own location so it doesn't fall through to the Nuxt dev proxy.
  location /audiobookshelf/socket.io {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://abs-server:3333;
  }

  # API + server routes -> abs-server
  location ~ ^/audiobookshelf/(api/|public/|hls/|auth/|feed/|status|login|logout|init) {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_pass http://abs-server:3333;
  }

  # Everything else under /audiobookshelf -> Nuxt dev (HMR)
  location /audiobookshelf/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_pass http://abs-client:3000;
  }
}
